title: Maestro Test
summary: Runs Maestro flows on an Android emulator or iOS simulator running on the Bitrise machine, and exports the results to Test Reports.
description: |-
  Runs your [Maestro](https://maestro.dev) flows locally on the build machine and exports the results.

  The Step installs the Maestro CLI, optionally installs your app on the device, runs `maestro test`, and exports:
  - the results to the Test Reports page, with each flow's screenshots, `startRecording` videos and logs attached to its test case
  - the Maestro test output folder as a zip artifact

  Add **Deploy to Bitrise.io** after this Step to upload the results.

  #### Device

  If a device is already running, for example one started by **AVD Manager** or **Xcode Start Simulator**, the Step runs the flows on it and leaves it running.

  If none is running, the Step boots one, and shuts it down when the flows finish:
  - Android: an emulator from the newest preinstalled system image (Linux stacks only).
  - iOS: the `Bitrise iOS default` simulator of the newest iOS runtime.

  To run several Maestro Test Steps on the same device, set **Shut down the device** to `no` on all but the last one. The Step then leaves the device it booted running and exports it, and the next Maestro Test Step runs on it instead of booting another one.

  If several devices are running, pass the one to use with `--device` in **Additional maestro test arguments**.

  #### Flow variables

  Maestro passes every environment variable with the `MAESTRO_` prefix to the flows, so an Env Var or Secret named `MAESTRO_USERNAME` is available as `${MAESTRO_USERNAME}`. To pass a variable under a different name, use `-e` in **Additional maestro test arguments**, for example `-e USERNAME=$TEST_ACCOUNT_USERNAME`.

website: https://github.com/bitrise-steplib/bitrise-step-maestro-test
source_code_url: https://github.com/bitrise-steplib/bitrise-step-maestro-test
support_url: https://github.com/bitrise-steplib/bitrise-step-maestro-test/issues

project_type_tags:
- ios
- android
- react-native
- flutter

type_tags:
- test

is_skippable: false

toolkit:
  go:
    package_name: github.com/bitrise-steplib/bitrise-step-maestro-test

inputs:
- flow_path: .maestro
  opts:
    title: Flow path
    summary: Maestro flow files or folders containing flow files, one per line.
    description: |-
      Maestro flow files or folders containing flow files, one per line. If a folder has a `config.yaml`, Maestro uses it.
    is_required: true

- app_path: |-
    $BITRISE_APK_PATH
    $BITRISE_APP_DIR_PATH
  opts:
    title: App path
    summary: The .apk or simulator .app to install before the flows run.
    description: |-
      The .apk or simulator .app to install before the flows run. By default the output of **Android Build** or **Xcode Build for Simulator**, whichever is set. Set your own path to override it, or clear it if the app is already installed.
    is_required: false

- include_tags: ""
  opts:
    title: Include tags
    summary: Run only the flows that have at least one of these tags (comma or newline separated).
    is_required: false

- exclude_tags: ""
  opts:
    title: Exclude tags
    summary: Skip the flows that have any of these tags (comma or newline separated).
    is_required: false

- test_name: Maestro
  opts:
    title: Test name
    summary: The name the results are shown under on the Test Reports page.
    is_required: true

- shutdown_device: "yes"
  opts:
    title: Shut down the device
    summary: Shut down the device the Step booted when the flows finish. A device that was already running is never shut down.
    description: |-
      Shut down the device the Step booted when the flows finish. A device that was already running is never shut down.

      Set it to `no` to leave the booted device running for a later Step, for example another Maestro Test Step. The Step then exports the device as `$BITRISE_EMULATOR_SERIAL` (Android) or `$BITRISE_XCODE_DESTINATION` (iOS).
    is_required: true
    value_options:
    - "yes"
    - "no"

- maestro_version: ""
  opts:
    category: Debugging
    title: Maestro CLI version override
    summary: Leave empty to use the Maestro CLI version this Step release was tested with.
    description: |-
      Leave empty to use the Maestro CLI version this Step release was tested with. The Step logs which version it installs.

      Set it only when you need a different version before a new Step release ships it. Untested versions can run your flows, but the Step's test output handling is only guaranteed for the tested version.

      Use the version number from a [Maestro release](https://github.com/mobile-dev-inc/maestro/releases) tag without the `cli-` prefix.
    is_required: false

- additional_args: ""
  opts:
    category: Debugging
    title: Additional maestro test arguments
    summary: Extra arguments appended to the `maestro test` command.
    description: |-
      Extra arguments appended to the `maestro test` command, for example `-e USERNAME=$TEST_ACCOUNT_USERNAME` or `--no-reinstall-driver`.
    is_required: false

- bitrise_test_result_dir: $BITRISE_TEST_RESULT_DIR
  opts:
    category: Debugging
    title: Step's test result directory
    summary: The per-step folder the Bitrise CLI creates for test results.
    is_required: true
    is_dont_change_value: true

outputs:
- MAESTRO_JUNIT_PATH:
  opts:
    title: JUnit report path
    summary: Path to the JUnit report written by Maestro.

- MAESTRO_TEST_OUTPUT_ZIP_PATH:
  opts:
    title: Test output zip path
    summary: Path to the zipped Maestro test output folder (screenshots, logs, recordings) in the deploy directory.

- BITRISE_EMULATOR_SERIAL:
  opts:
    title: Emulator serial
    summary: Serial of the emulator the Step booted and left running. Only set when **Shut down the device** is `no`.

- BITRISE_XCODE_DESTINATION:
  opts:
    title: Simulator destination
    summary: Destination specifier of the simulator the Step booted and left running. Only set when **Shut down the device** is `no`.
