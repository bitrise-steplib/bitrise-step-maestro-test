format_version: "15"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - SAMPLES_URL: https://storage.googleapis.com/mobile.dev/samples/samples.zip

workflows:
  test_android:
    title: Android flows picked by tags
    description: Runs the basic Android flow of the Maestro samples folder, picked by include and exclude tags, on an AVD Manager emulator.
    envs:
    - TEST_NAME: Maestro Android
    - EXPECTED_FLOW: android-flow
    steps:
    - bundle::android_tagged_flows: {}

  test_android_failing_flow_exports_results:
    title: Android failing flow
    description: Runs a flow that fails and checks that its report and screenshot are still exported.
    envs:
    - TEST_NAME: Maestro Android failing
    steps:
    - bundle::android_failing_flow: {}

  test_ios:
    title: iOS flows picked by tags
    description: Runs the basic iOS flow of the Maestro samples folder, picked by include and exclude tags, on an Xcode Start Simulator simulator.
    envs:
    - TEST_NAME: Maestro iOS
    - EXPECTED_FLOW: ios-flow
    steps:
    - bundle::ios_tagged_flows: {}

  test_ios_flaky_flow:
    title: iOS flow that passes on a retry
    description: Runs a flow that fails on its first run and passes on the retry, and checks that the Step passes and the report keeps both runs.
    envs:
    - TEST_NAME: Maestro iOS flaky
    steps:
    - bundle::ios_flaky_flow: {}

  test_ios_quarantined_flow:
    title: iOS quarantined flow
    description: Runs the iOS flows of the Maestro samples folder with the advanced one quarantined, and checks that only the basic flow ran.
    envs:
    - TEST_NAME: Maestro iOS quarantine
    - EXPECTED_FLOW: ios-flow
    steps:
    - bundle::ios_quarantined_flow: {}

step_bundles:
  android_tagged_flows:
    run_if: |-
      {{ or (envcontain "BITRISEIO_STACK_ID" "ubuntu") (not .IsCI) }}
    steps:
    - bundle::download_samples: {}
    - bundle::start_android_emulator: {}
    - path::./:
        title: Execute step
        inputs:
        - app_path: $SAMPLES_DIR/wikipedia.apk
        - flow_path: $SAMPLES_DIR
        - include_tags: android
        - exclude_tags: advanced
        - test_name: $TEST_NAME
    - bundle::verify_outputs: {}
    - bundle::verify_tag_filtering: {}
    - bundle::stop_android_emulator: {}

  android_failing_flow:
    run_if: |-
      {{ or (envcontain "BITRISEIO_STACK_ID" "ubuntu") (not .IsCI) }}
    steps:
    - bundle::download_samples: {}
    - bundle::start_android_emulator: {}
    - script@1:
        title: Write a failing flow
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            mkdir -p "$SAMPLES_DIR/helpers"
            cat > "$SAMPLES_DIR/helpers/launch.yaml" <<'EOF'
            appId: org.wikipedia
            ---
            - launchApp
            EOF
            cat > "$SAMPLES_DIR/failing-flow.yaml" <<'EOF'
            appId: org.wikipedia
            ---
            - runFlow: helpers/launch.yaml
            - tapOn:
                text: "This button is never on screen"
                optional: true
            - assertVisible: "This text is never on screen"
            EOF
    - path::./:
        title: Execute step
        is_skippable: true
        inputs:
        - app_path: $SAMPLES_DIR/wikipedia.apk
        - flow_path: $SAMPLES_DIR/failing-flow.yaml
        - test_name: $TEST_NAME
    - script@1:
        title: Verify the report has the failure
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            grep -q "<failure" "$MAESTRO_JUNIT_PATH"
            find "$BITRISE_TEST_DEPLOY_DIR" -path "*/$TEST_NAME/*/screenshots/*.png" | grep -q .
            test_run_dir="$(find "$BITRISE_TEST_DEPLOY_DIR" -type d -name "$TEST_NAME" | head -1)"
            report="$test_run_dir/$(basename "$MAESTRO_JUNIT_PATH")"
            grep -q '<system-out>' "$report"
            grep -q '^ *✓ Run helpers/launch.yaml' "$report"
            grep -q '^   *✓ Launch app' "$report"
            grep -q '^ *⚠ Tap on (Optional)' "$report"
            grep -q '^ *✗ Assert that "This text is never on screen" is visible' "$report"
    - bundle::verify_outputs: {}
    - bundle::stop_android_emulator: {}

  ios_tagged_flows:
    run_if: |-
      {{ or (envcontain "BITRISEIO_STACK_ID" "osx") (not .IsCI) }}
    steps:
    - bundle::prepare_ios: {}
    - path::./:
        title: Execute step
        inputs:
        - app_path: $SAMPLES_DIR/Wikipedia.app
        - flow_path: $SAMPLES_DIR
        - include_tags: ios
        - exclude_tags: advanced
        - test_name: $TEST_NAME
    - bundle::verify_outputs: {}
    - bundle::verify_tag_filtering: {}

  ios_flaky_flow:
    run_if: |-
      {{ or (envcontain "BITRISEIO_STACK_ID" "osx") (not .IsCI) }}
    steps:
    - bundle::prepare_ios: {}
    - script@1:
        title: Write a flow that fails on the app's first launch only
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            cat > "$SAMPLES_DIR/flaky-flow.yaml" <<'EOF'
            appId: org.wikimedia.wikipedia
            name: flaky-flow
            ---
            - launchApp
            - extendedWaitUntil:
                visible: "Next"
                timeout: 15000
                optional: true
                label: Wait for the onboarding, shown on the first launch only
            - runFlow:
                when:
                  visible: "Next"
                commands:
                  - runFlow: subflows/onboarding-ios.yaml
                  - assertVisible: "This text is never on screen"
                label: Fail on the first launch, after finishing the onboarding
            EOF
    - path::./:
        title: Execute step
        inputs:
        - app_path: $SAMPLES_DIR/Wikipedia.app
        - flow_path: $SAMPLES_DIR/flaky-flow.yaml
        - num_flaky_test_attempts: "1"
        - test_name: $TEST_NAME
    - script@1:
        title: Verify the report has the failed and the passed run
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            test "$(grep -c '<testcase ' "$MAESTRO_JUNIT_PATH")" = 2
            test "$(grep -c '<failure' "$MAESTRO_JUNIT_PATH")" = 1
            test_run_dir="$(find "$BITRISE_TEST_DEPLOY_DIR" -type d -name "$TEST_NAME" | head -1)"
            grep -q 'value="attempt-2/flaky-flow/' "$test_run_dir/$(basename "$MAESTRO_JUNIT_PATH")"
    - bundle::verify_outputs: {}

  ios_quarantined_flow:
    run_if: |-
      {{ or (envcontain "BITRISEIO_STACK_ID" "osx") (not .IsCI) }}
    steps:
    - bundle::prepare_ios: {}
    - path::./:
        title: Execute step
        inputs:
        - app_path: $SAMPLES_DIR/Wikipedia.app
        - flow_path: $SAMPLES_DIR
        - include_tags: ios
        - quarantined_tests: "[{\"testCaseName\":\"ios-advanced-flow\",\"className\":\"ios-advanced-flow\",\"testSuiteName\":[\"Test Suite\"]}]"
        - test_name: $TEST_NAME
    - bundle::verify_outputs: {}
    - bundle::verify_tag_filtering: {}

  prepare_ios:
    steps:
    - bundle::download_samples: {}
    - xcode-start-simulator@0:
        inputs:
        - destination: platform=iOS Simulator,name=Bitrise iOS default,OS=latest
        - reset: "yes"
        - wait_for_boot_timeout: 120
    - script@1:
        title: Unzip sample app
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            unzip -q "$SAMPLES_DIR/wikipedia.zip" -d "$SAMPLES_DIR"

  download_samples:
    steps:
    - script@1:
        title: Download Maestro samples
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            dir="$(mktemp -d)"
            curl -fsSL "$SAMPLES_URL" -o "$dir/samples.zip"
            unzip -q "$dir/samples.zip" -d "$dir"
            envman add --key SAMPLES_DIR --value "$dir"

  start_android_emulator:
    steps:
    - script@1:
        title: Set ABI based on OS
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            if [[ "$OSTYPE" == "linux-gnu"* ]]; then
              envman add --key ABI --value x86_64
            else
              envman add --key ABI --value arm64-v8a
            fi
    - avd-manager@2:
        inputs:
        - api_level: 34
        - tag: google_apis
        - profile: pixel
        - abi: $ABI

  verify_outputs:
    steps:
    - script@1:
        title: Verify outputs
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            test -s "$MAESTRO_JUNIT_PATH"
            grep -q "<testcase" "$MAESTRO_JUNIT_PATH"
            test -s "$MAESTRO_TEST_OUTPUT_ZIP_PATH"

            test_run_dir="$(find "$BITRISE_TEST_DEPLOY_DIR" -type d -name "$TEST_NAME" | head -1)"
            test -s "$test_run_dir/test-info.json"
            report="$test_run_dir/$(basename "$MAESTRO_JUNIT_PATH")"
            grep -q 'name="attachment_0"' "$report"
            grep -o 'name="attachment_[0-9]*" value="[^"]*"' "$report" | sed 's/.*value="\(.*\)"/\1/' | while read -r attachment; do
              test -s "$test_run_dir/$attachment"
            done

  verify_tag_filtering:
    steps:
    - script@1:
        title: Verify only the flow matching the tags ran
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            test_run_dir="$(find "$BITRISE_TEST_DEPLOY_DIR" -type d -name "$TEST_NAME" | head -1)"
            report="$test_run_dir/$(basename "$MAESTRO_JUNIT_PATH")"
            test "$(grep -c '<testcase ' "$report")" = 1
            grep -q "<testcase[^>]*name=\"$EXPECTED_FLOW\"" "$report"

  stop_android_emulator:
    steps:
    - script@1:
        title: Stop the emulator so the next test starts with one device
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            adb -s "$BITRISE_EMULATOR_SERIAL" emu kill
